<!DOCTYPE html>
<html lang="en">
<head>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5903031199985375"
      crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KING.NET Sliter Game with Gemini AI</title>
    <link rel="icon" type="image/x-icon" href="https://king.net/games/images/favicon-kingnet.ico">
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none; /* Prevents scrolling and other default touch actions */
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            background-color: #000;
        }

        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
        }

        #score {
            font-size: 1.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin: 0;
        }
        
        #skin-customizer {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        #skin-prompt {
            background: #333;
            border: 1px solid #555;
            color: white;
            padding: 8px;
            border-radius: 5px;
            font-size: 0.9em;
        }

        #generate-skin-btn {
            background: linear-gradient(145deg, #8e44ad, #9b59b6);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #generate-skin-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }


        #joystick-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background-color: rgba(128, 128, 128, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #joystick-knob {
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: absolute;
        }
        
        #gameOverModal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .modal-content {
            background-color: #222;
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #555;
            max-width: 90%;
            width: 400px;
        }
        
        #gameOverModal h2 {
            font-size: 3em;
            color: #ff4757;
            margin: 0 0 10px 0;
        }
        
        #socialShareButtons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        #socialShareButtons button {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        #socialShareButtons button:hover {
            opacity: 0.8;
        }

        #backToKingNetBtn, #restartBtn {
            padding: 15px 30px;
            font-size: 1.5em;
            color: white;
            background-color: #2ed573;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div class="ui-panel">
             <p id="score">Score: 0</p>
        </div>
        
        <div id="skin-customizer">
            <input type="text" id="skin-prompt" placeholder="Describe a snake skin...">
            <button id="generate-skin-btn">✨ Generate Skin</button>
        </div>

        <div id="joystick-container">
            <div id="joystick-knob"></div>
        </div>
    </div>
    
    <div id="gameOverModal" style="display: none;">
        <div class="modal-content">
            <h2>Game Over</h2>
            <p id="finalScoreText">Your score: 0</p>
            
            <div id="socialShareButtons">
                <button id="twitterShareBtn">Share on Twitter</button>
                <button id="facebookShareBtn">Share on Facebook</button>
                <button id="instagramShareBtn">Share on Instagram</button>
            </div>
            
            <button id="restartBtn">Play Again</button>
            <button id="backToKingNetBtn" onclick="window.location.href='https://king.net'">Back to KING.NET</button>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const gameOverModal = document.getElementById('gameOverModal');
    const finalScoreText = document.getElementById('finalScoreText');
    const restartBtn = document.getElementById('restartBtn');
    const backToKingNetBtn = document.getElementById('backToKingNetBtn');
    const generateSkinBtn = document.getElementById('generate-skin-btn');
    const skinPromptInput = document.getElementById('skin-prompt');

    const twitterShareBtn = document.getElementById('twitterShareBtn');
    const facebookShareBtn = document.getElementById('facebookShareBtn');
    const instagramShareBtn = document.getElementById('instagramShareBtn');

    let animationFrameId = null; // Initialize to null
    let player, food, score, worldSize, bots;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    
    // --- Joystick Controls ---
    const joystickContainer = document.getElementById('joystick-container');
    const joystickKnob = document.getElementById('joystick-knob');
    let joystickActive = false;
    let joystickStartX = 0;
    let joystickStartY = 0;
    let playerAngle = 0;
    
    function handleJoystickStart(e) { e.preventDefault(); joystickActive = true; const touch = e.type === 'touchstart' ? e.touches[0] : e; const rect = joystickContainer.getBoundingClientRect(); joystickStartX = rect.left + rect.width / 2; joystickStartY = rect.top + rect.height / 2; }
    function handleJoystickMove(e) { if (!joystickActive) return; e.preventDefault(); const touch = e.type === 'touchmove' ? e.touches[0] : e; const deltaX = touch.clientX - joystickStartX; const deltaY = touch.clientY - joystickStartY; playerAngle = Math.atan2(deltaY, deltaX); const maxMove = joystickContainer.clientWidth / 4; const moveX = Math.cos(playerAngle) * maxMove; const moveY = Math.sin(playerAngle) * maxMove; joystickKnob.style.transform = `translate(${moveX}px, ${moveY}px)`;}
    function handleJoystickEnd(e) { if (!joystickActive) return; e.preventDefault(); joystickActive = false; joystickKnob.style.transform = `translate(0px, 0px)`; }
    joystickContainer.addEventListener('mousedown', handleJoystickStart);
    document.addEventListener('mousemove', handleJoystickMove);
    document.addEventListener('mouseup', handleJoystickEnd);
    joystickContainer.addEventListener('touchstart', handleJoystickStart);
    document.addEventListener('touchmove', handleJoystickMove);
    document.addEventListener('touchend', handleJoystickEnd);

    // --- Game Objects ---
    class Snake {
        constructor(x, y, radius, headColor, bodyColor, isPlayer = false) {
            this.x = x; this.y = y; this.radius = radius;
            this.headColor = headColor || 'hsl(200, 100%, 50%)';
            this.bodyColor = bodyColor || 'rgba(0, 255, 100, opacity)';
            this.isPlayer = isPlayer;
            this.speed = isPlayer ? 3 : 2;
            this.body = [];
            for(let i = 0; i < 10; i++) { this.body.push({x: this.x, y: this.y}); }
            this.maxLength = 10;
            this.angle = Math.random() * Math.PI * 2;
            this.target = null;
            this.turnSpeed = Math.PI / 60;
        }

        draw() {
            for(let i = this.body.length - 1; i > 0; i--) {
                ctx.beginPath();
                const scale = 1 - (i / this.body.length) * 0.5;
                ctx.arc(this.body[i].x, this.body[i].y, this.radius * scale, 0, Math.PI * 2);
                const opacity = 1 - i / this.body.length;
                ctx.fillStyle = this.isPlayer ? this.bodyColor.replace('opacity', opacity) : this.headColor;
                ctx.fill();
            }
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.headColor;
            ctx.fill();
        }

        update() {
            if(this.isPlayer) { if (joystickActive) this.angle = playerAngle; } 
            else {
                this.findClosestFood();
                if (this.target) { const targetAngle = Math.atan2(this.target.y - this.y, this.target.x - this.x); let deltaAngle = targetAngle - this.angle; while(deltaAngle > Math.PI) deltaAngle -= Math.PI * 2; while(deltaAngle < -Math.PI) deltaAngle += Math.PI * 2; this.angle += Math.sign(deltaAngle) * Math.min(Math.abs(deltaAngle), this.turnSpeed); } 
                else { this.angle += (Math.random() - 0.5) * 0.1; }
            }
            this.x += Math.cos(this.angle) * this.speed; this.y += Math.sin(this.angle) * this.speed;
            this.x = Math.max(this.radius, Math.min(worldSize.width - this.radius, this.x));
            this.y = Math.max(this.radius, Math.min(worldSize.height - this.radius, this.y));
            this.body.unshift({x: this.x, y: this.y});
            if (this.body.length > this.maxLength) { this.body.pop(); }
        }

        findClosestFood() { let closestDist = 400; let closestFood = null; food.forEach(f => { const dist = Math.hypot(this.x - f.x, this.y - f.y); if (dist < closestDist) { closestDist = dist; closestFood = f; } }); this.target = closestFood; }
        grow() { this.maxLength += 3; }
        die() { const numPellets = Math.floor(this.maxLength / 2); for(let i = 0; i < numPellets; i++) { const segmentIndex = Math.floor(i * (this.body.length / numPellets)); const segment = this.body[segmentIndex]; if(segment) { const radius = 7; const pelletColor = this.headColor; food.push(new Food(segment.x + (Math.random()-0.5)*10, segment.y+ (Math.random()-0.5)*10, radius, pelletColor)); } } }
        setSkin(headColor, bodyColor) { this.headColor = headColor; this.bodyColor = bodyColor; }
    }

    class Food {
        constructor(x, y, radius, color) { this.x = x; this.y = y; this.radius = radius; this.color = color; }
        draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false); ctx.fillStyle = this.color; ctx.fill(); }
    }

    function init() {
        worldSize = { width: 2000, height: 2000 };
        const head = player ? player.headColor : 'hsl(200, 100%, 50%)';
        const body = player ? player.bodyColor : 'rgba(0, 255, 100, opacity)';
        player = new Snake(worldSize.width / 2, worldSize.height / 2, 15, head, body, true);
        
        food = []; for (let i = 0; i < 200; i++) { spawnFood(); }
        bots = []; for (let i = 0; i < 20; i++) { spawnBot(); }

        score = 0; scoreEl.textContent = 'Score: 0';
        gameOverModal.style.display = 'none';
        
        if (animationFrameId === null) {
            animationFrameId = requestAnimationFrame(animate);
        }
    }
    
    function spawnFood() { const radius = 7; const x = Math.random() * (worldSize.width - radius * 2) + radius; const y = Math.random() * (worldSize.height - radius * 2) + radius; const color = `hsl(${Math.random() * 360}, 100%, 50%)`; food.push(new Food(x, y, radius, color)); }
    function spawnBot() { const radius = 15; const x = Math.random() * (worldSize.width - radius * 2) + radius; const y = Math.random() * (worldSize.height - radius * 2) + radius; const color = `hsl(${Math.random() * 360}, 80%, 60%)`; bots.push(new Snake(x, y, radius, color, null, false)); }

    function checkCollisions() {
        // Player vs Bot collisions
        for (let i = bots.length - 1; i >= 0; i--) {
            const bot = bots[i];
            // Head-on collision
            const headDist = Math.hypot(player.x - bot.x, player.y - bot.y);
            if (headDist < player.radius + bot.radius) {
                if (player.maxLength >= bot.maxLength) {
                    bot.die(); bots.splice(i, 1); spawnBot();
                } else {
                    console.log("GAME OVER: Player lost a head-on collision with a bot.", bot); // Diagnostic Log
                    gameOver(); return;
                }
                continue;
            }
            // Player head vs Bot body
            if (checkHeadToBodyCollision(player, bot)) {
                console.log("GAME OVER: Player head collided with bot body.", bot); // Diagnostic Log
                gameOver(); return;
            }
            // Bot head vs Player body
            if (checkHeadToBodyCollision(bot, player)) {
                bot.die(); bots.splice(i, 1); spawnBot();
            }
        }

        // Bot vs Bot collisions
        for (let i = bots.length - 1; i >= 0; i--) {
            for (let j = i - 1; j >= 0; j--) {
                const bot1 = bots[i]; const bot2 = bots[j];
                if (!bot1 || !bot2) continue;
                const headDist = Math.hypot(bot1.x - bot2.x, bot1.y - bot2.y);
                if (headDist < bot1.radius + bot2.radius) {
                     if (bot1.maxLength >= bot2.maxLength) { bot2.die(); bots.splice(j, 1); spawnBot();
                     } else { bot1.die(); bots.splice(i, 1); spawnBot(); break; }
                     continue;
                }
                if (checkHeadToBodyCollision(bot1, bot2)) { bot1.die(); bots.splice(i, 1); spawnBot(); break; }
                if (checkHeadToBodyCollision(bot2, bot1)) { bot2.die(); bots.splice(j, 1); spawnBot(); }
            }
        }
    }
    
    function checkFoodConsumption() {
        for (let i = food.length - 1; i >= 0; i--) {
            const f = food[i];
            const pDist = Math.hypot(player.x - f.x, player.y - f.y); 
            if (pDist - f.radius - player.radius < 1) { 
                food.splice(i, 1); spawnFood(); player.grow(); score++; 
                scoreEl.textContent = `Score: ${score}`; 
                continue;
            }
            for (let j = bots.length - 1; j >= 0; j--) {
                const bot = bots[j];
                const bDist = Math.hypot(bot.x - f.x, bot.y - f.y);
                if (bDist - f.radius - bot.radius < 1) {
                    food.splice(i, 1); spawnFood(); bot.grow();
                    break;
                }
            }
        }
    }

    function checkHeadToBodyCollision(headSnake, bodySnake) {
        // Skip check for the player's own body if headSnake is the player
        if (headSnake.isPlayer && headSnake === bodySnake) {
            return false;
        }

        for (let i = 1; i < bodySnake.body.length; i++) {
            const segment = bodySnake.body[i];
            const segmentScale = 1 - (i / bodySnake.body.length) * 0.5;
            const segmentRadius = bodySnake.radius * segmentScale;
            const dist = Math.hypot(headSnake.x - segment.x, headSnake.y - segment.y);
            if (dist < headSnake.radius + segmentRadius) {
                return true;
            }
        }
        return false;
    }
    
    function animate() {
        animationFrameId = requestAnimationFrame(animate);
        player.update();
        bots.forEach(bot => bot.update());
        checkCollisions();
        if (animationFrameId === null) return; // Stop animation if game over
        checkFoodConsumption();
        
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.save(); ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);
        food.forEach(f => f.draw());
        bots.forEach(bot => bot.draw());
        player.draw();
        ctx.restore();
    }

    function gameOver() {
        if (animationFrameId === null) return; // Prevent multiple calls
        cancelAnimationFrame(animationFrameId); 
        animationFrameId = null;
        player.die(); 
        finalScoreText.innerText = `Your score: ${score}`; 
        gameOverModal.style.display = 'flex'; 

        // Capture screenshot and enable social sharing
        captureScreenshotForShare();
    }
    
    restartBtn.addEventListener('click', () => { 
        gameOverModal.style.display = 'none';
        init();
        // Ensure animate is called only once
        if (animationFrameId === null) {
            animate();
        }
    });

    // --- Social Media Sharing ---
    let screenshotDataUrl = '';

    function captureScreenshotForShare() {
        // Temporarily hide UI elements to capture a clean screenshot
        const uiElements = document.querySelectorAll('.ui-panel, #skin-customizer, #joystick-container');
        uiElements.forEach(el => el.style.visibility = 'hidden');

        // Draw the game scene again to ensure it's up-to-date for the screenshot
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);
        food.forEach(f => f.draw());
        bots.forEach(bot => bot.draw());
        player.draw();
        ctx.restore();

        try {
            screenshotDataUrl = canvas.toDataURL('image/png');
        } catch (error) {
            console.error("Error capturing screenshot:", error);
            screenshotDataUrl = ''; // Clear if there's an error
        } finally {
            // Restore UI elements
            uiElements.forEach(el => el.style.visibility = 'visible');
        }
    }

    twitterShareBtn.addEventListener('click', () => {
        const text = encodeURIComponent(`I scored ${score} in KING.NET - Sliter Game! Can you beat my score? #SlitherGame #HTML5Game`);
        const url = encodeURIComponent(window.location.href);
        const twitterUrl = `https://twitter.com/intent/tweet?text=${text}&url=${url}`;
        
        if (screenshotDataUrl) {
            // Twitter's intent API doesn't directly support image uploads.
            // For images, typically you'd upload to a service and link, or
            // for simpler integration, omit the image and focus on text/URL.
            // For this example, we'll open a new tab with text and URL.
        }
        window.open(twitterUrl, '_blank');
    });

    facebookShareBtn.addEventListener('click', () => {
        const quote = encodeURIComponent(`I scored ${score} in KING.NET - Sliter Game!`);
        const href = encodeURIComponent(window.location.href);
        const facebookUrl = `https://www.facebook.com/sharer/sharer.php?quote=${quote}&href=${href}`;
        window.open(facebookUrl, '_blank');
    });

    instagramShareBtn.addEventListener('click', () => {
        alert('Instagram sharing from a web page is complex and usually requires server-side integration or users to manually upload. Please save the screenshot and share it manually!');
        // For actual Instagram sharing, you would typically:
        // 1. Upload the image to a server.
        // 2. Use Instagram's Graph API (requires app and permissions)
        // 3. Or, instruct the user to download the image and upload manually.
        // As a simple example, we'll allow downloading the image:
        if (screenshotDataUrl) {
            const link = document.createElement('a');
            link.href = screenshotDataUrl;
            link.download = `slither_score_${score}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    });

    // --- Gemini API Integration (Placeholder - you'll need to fill this in) ---
    async function callGeminiForPepTalk() {

        // You'll need to add your actual Gemini API call logic here.
        console.log("Gemini Pep Talk functionality is a placeholder. Implement your API call here.");
        // Example:
        // pepTalkContainer.textContent = "Great effort! Keep practicing and you'll master the game!";
    }

    async function callGeminiForSkin() {
        // This function was originally in your code but omitted for brevity.
        // You'll need to add your actual Gemini API call logic here to generate skin colors.
        console.log("Gemini Skin Generation functionality is a placeholder. Implement your API call here.");
        // Example:
        // const prompt = skinPromptInput.value;
        // if (prompt) {
        //     generateSkinBtn.disabled = true;
        //     skinPromptInput.disabled = true;
        //     skinPromptInput.placeholder = "Generating...";
        //     try {
        //         // Simulate API call
        //         await new Promise(resolve => setTimeout(resolve, 2000));
        //         const newHeadColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
        //         const newBodyColor = `rgba(${Math.random() * 255}, ${Math.random() * 255}, ${Math.random() * 255}, opacity)`;
        //         player.setSkin(newHeadColor, newBodyColor);
        //         skinPromptInput.value = '';
        //         skinPromptInput.placeholder = "Describe a snake skin...";
        //     } catch (error) {
        //         console.error("Error generating skin:", error);
        //         skinPromptInput.placeholder = "Error generating. Try again.";
        //     } finally {
        //         generateSkinBtn.disabled = false;
        //         skinPromptInput.disabled = false;
        //     }
        // }
    }

    // Event listener for generating skin
    generateSkinBtn.addEventListener('click', callGeminiForSkin);

    // Initial game start
    init();
});
</script>
